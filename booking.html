<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Booking Form</title>
  <link rel="stylesheet" href="Bstyles.css" />
</head>
<body>
  <div class="container">
    <h2>Book Your Consultation</h2>
    <form action="https://sheetdb.io/api/v1/whuafg5tv9v2c" method="POST" id="bookingForm">
      <label for="name">Name:</label>
      <input type="text" id="name" name="data[Name]" required />

      <label for="contact">Contact Number:</label>
      <input type="tel" id="contact" name="data[Contact]" required />

      <label for="email">Email ID:</label>
      <input type="email" id="email" name="data[Email]" required />

      <label for="age">Age:</label>
      <input type="number" id="age" name="data[Age]" required />

      <label for="gender">Gender:</label>
      <select id="gender" name="data[Gender]" required>
        <option value="">Select</option>
        <option value="Female">Female</option>
        <option value="Male">Male</option>
        <option value="Other">Other</option>
      </select>

      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
