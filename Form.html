<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="Fglobals.css" />
    <link rel="stylesheet" href="Fstyleguide.css" />
    <link rel="stylesheet" href="Fstyle.css" />
  </head>
  <body>
    <div class="booking">
      <p class="text-wrapper">Easy and hassle-free doctor appointments at your convenience.</p>
      <!--Form start-->
      <from
      action="https://sheetdb.io/api/v1/whuafg5tv9v2c"
      <div class="frame">
        <div class="personal-details">
          <div class="div-wrapper"><div class="div">Name</div></div>
          <div class="div-wrapper"><div class="div">Contact No.</div></div>
          <div class="div-wrapper"><div class="div">Email id</div></div>
          <div class="div-wrapper"><div class="div">Age</div></div>
          <div class="div-wrapper"><div class="div">Gender</div></div>
        </div>
      </div>
      <div class="frame-2">
        <div class="frame-3">
          <div class="search-bar">
            <div class="text-wrapper-2">Payment method</div>
            <img class="img" src="img/caret-down.svg" />
          </div>
          <div class="DROPDOWN-ITEMS">
            <div class="option"><div class="text-wrapper-2">In-clinic visit</div></div>
            <div class="option"><div class="text-wrapper-2">Video consultation</div></div>
          </div>
        </div>
        <div class="search-bar-2">
          <div class="text-wrapper-3">Search for Doctor...</div>
          <img class="img" src="img/magnifying-glass.svg" />
        </div>
        <div class="date">
          <div class="text-wrapper-3">DD/MM/YY</div>
          <img class="img" src="img/calendar.svg" />
        </div>
        <div class="frame-4">
          <div class="search-bar">
            <div class="text-wrapper-4">Select Consultation Type</div>
            <img class="caret-down" src="img/image.svg" />
          </div>
          <div class="DROPDOWN-ITEMS">
            <div class="option"><div class="text-wrapper-2">In-clinic visit</div></div>
            <div class="option"><div class="text-wrapper-2">Video consultation</div></div>
          </div>
        </div>
        <div class="frame-5">
          <div class="time">
            <div class="text-wrapper-3">09:00</div>
            <img class="img" src="img/caret-down-2.svg" />
          </div>
          <div class="text-wrapper-5">To</div>
          <div class="time">
            <div class="text-wrapper-3">10:00</div>
            <img class="img" src="img/caret-down-3.svg" />
          </div>
        </div>
        <button class="cta"><div class="text-wrapper-6">Confirm</div></button>
      </div>
      <div class="text-wrapper-7">Book Your Consultation</div>
      <div class="frame-6">
        <img class="caret-left" src="img/caret-left.svg" />
        <div class="text-wrapper-8">Back</div>
      </div>
    </div>
  </body>
</html>
